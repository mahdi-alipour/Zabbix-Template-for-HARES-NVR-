              preprocessing:
                - type: REGEX
                  parameters:
                    - 'IPC\.NO:\s*{#IPCNO}\s+IPC\.Name:.*?IPC\.Model:\s*(\S+)'
                    - \1
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: hares.ipc.raw
              tags:
                - tag: component
                  value: camera
                - tag: camera
                  value: '{#IPCNO}'
            - uuid: 'b5640c180d384cd3b26e471ca82285ba'
              name: 'Camera {#IPCNO} ({#IPCNAME}): firmware'
              type: DEPENDENT
              key: 'hares.ipc.software[{#IPCNO}]'
              delay: '0'
              history: 31d
              trends: '0'
              value_type: CHAR
              preprocessing:
                - type: REGEX
                  parameters:
                    - 'IPC\.NO:\s*{#IPCNO}\s+IPC\.Name:.*?IPC\.Software:\s*(\S+)'
                    - \1
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: hares.ipc.raw
              tags:
                - tag: component
                  value: camera
                - tag: camera
                  value: '{#IPCNO}'
          trigger_prototypes:
            - uuid: 'eb4cc504aebf4a908dae2830a83def9e'
              expression: 'max(/HARES NVR-A64RH-16D by SNMP/hares.ipc.online[{#IPCNO}],#3)=0'
              name: 'Camera {#IPCNO} ({#IPCNAME}, {#IPCIP}) is offline'
              priority: AVERAGE
              description: 'NVR reports IPC.Status different from {$HARES.IPC.STATUS.OK} for 3 consecutive polls.'
              dependencies:
                - name: 'SNMP is not available'
                  expression: 'max(/HARES NVR-A64RH-16D by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: availability
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var re = /IPC\.NO:\s*(\d+)\s+IPC\.Name:\s*(.*?)\s+IPC\.IP:\s*(\S+)/g;
                  var out = [], m;
                  while ((m = re.exec(value || '')) !== null) {
                    out.push({'{#IPCNO}': m[1], '{#IPCNAME}': m[2], '{#IPCIP}': m[3]});
                  }
                  return JSON.stringify(out);
          master_item:
            key: hares.ipc.raw
        - uuid: 'b00e42cc45f64ac89e63f242cf47cb31'
          name: 'Channel discovery'
          type: DEPENDENT
          key: hares.channel.discovery
          delay: '0'
          lifetime: 7d
