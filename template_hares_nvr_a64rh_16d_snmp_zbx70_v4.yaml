                  var re = /CHLID:\s*(\d+)/g, out = [], m;
                  while ((m = re.exec(value || '')) !== null) { out.push({'{#CHLID}': m[1]}); }
                  return JSON.stringify(out);
          master_item:
            key: hares.channel.raw
        - uuid: '8ebb40bd49244753a60cd2876bcf5873'
          name: 'Network interface discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]'
          key: hares.net.if.discovery
          status: DISABLED
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$HARES.NET.IF.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          lifetime: 7d
          description: 'DISABLED: this NVR SNMP agent does not implement IF-MIB/ifXTable (verified by walk). Enable only if a firmware update adds it; otherwise monitor traffic on the switch port the NVR is connected to.'
          item_prototypes:
            - uuid: 'e07940cdd2a5427fb71f2e5805da8636'
              name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: 1m
              history: 7d
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: '6734bfdd26f14ec18beb640a051d1be4'
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 1m
              history: 31d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: '873d6c5b7f92432c9032ee83cc1d2bef'
              name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 1m
              history: 31d
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: '52877d1caa264596941add9ac742806f'
              name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 1m
              history: 31d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: '447cf7adaa2941a3837b6fae380eb91a'
              name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 1m
              history: 31d
              units: pps
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: '6580e4f889ca4ff09e2b8a163d71db1a'
              name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 1h
              history: 31d
              units: bps
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 'a401930120ab480895cda2085e4cba72'
              expression: '{$HARES.IF.CONTROL:"{#IFNAME}"}=1 and last(/HARES NVR-A64RH-16D by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/HARES NVR-A64RH-16D by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/HARES NVR-A64RH-16D by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/HARES NVR-A64RH-16D by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$HARES.IF.CONTROL:"{#IFNAME}"}=0'
              name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
              priority: AVERAGE
              description: 'Set macro {$HARES.IF.CONTROL:"<ifname>"}=0 to disable this trigger for unused ports.'
              manual_close: 'YES'
              dependencies:
                - name: 'SNMP is not available'
                  expression: 'max(/HARES NVR-A64RH-16D by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: availability
            - uuid: '68f6b10a9aac47c9bd67c26255fa9986'
              expression: 'min(/HARES NVR-A64RH-16D by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>0 or min(/HARES NVR-A64RH-16D by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>0'
              name: 'Interface {#IFNAME}({#IFALIAS}): High error rate'
              priority: WARNING
              description: 'Packet errors were seen continuously for 5 minutes.'
              dependencies:
                - name: 'SNMP is not available'
                  expression: 'max(/HARES NVR-A64RH-16D by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              tags:
                - tag: scope
                  value: performance
      tags:
        - tag: class
          value: hardware
        - tag: target
          value: nvr
        - tag: vendor
          value: hares
      macros:
        - macro: '{$HARES.CPU.UTIL.MAX}'
          value: '90'
          description: 'CPU utilization threshold, %'
        - macro: '{$HARES.DISK.PUSED.WARN}'
          value: '95'
          description: 'Disk used-space threshold, % (NVR loop recording normally keeps disks near full)'
        - macro: '{$HARES.DISK.STATUS.OK}'
          value: '3'
          description: 'Disk status code meaning healthy (observed: 3)'
        - macro: '{$HARES.DISK.UNIT.MULTIPLIER}'
          value: '1048576'
          description: 'Bytes per unit of the disk capacity numbers reported by the NVR. Device labels them (KB) but the values are MB (verified: RAID6, 7 active x 8TB = ~36.3 TiB). 1048576 = MB, 1024 = KB.'
        - macro: '{$HARES.HTTPS.PORT}'
          value: '443'
        - macro: '{$HARES.HTTPS.EXPECTED}'
          value: '1'
          description: 'Expected HTTPS state: 1 = enabled, 0 = disabled'
        - macro: '{$HARES.ONVIF.EXPECTED}'
          value: '1'
          description: 'Expected ONVIF state: 1 = enabled, 0 = disabled'
        - macro: '{$HARES.ONVIF.PATH}'
          value: /onvif/device_service
          description: 'ONVIF device service path (standard). Test: curl -i -X POST -H "Content-Type: application/soap+xml" --data "<s:Envelope xmlns:s=\"http://www.w3.org/2003/05/soap-envelope\"><s:Body><GetSystemDateAndTime xmlns=\"http://www.onvif.org/ver10/device/wsdl\"/></s:Body></s:Envelope>" http://NVR-IP/onvif/device_service'
        - macro: '{$HARES.ONVIF.PORT}'
          value: '80'
        - macro: '{$HARES.TELNET.EXPECTED}'
          value: '0'
          description: 'Expected Telnet state: 1 = enabled, 0 = disabled'
        - macro: '{$HARES.TELNET.PORT}'
          value: '23'
        - macro: '{$HARES.IF.CONTROL}'
          value: '1'
          description: 'Link-down trigger control. Use {$HARES.IF.CONTROL:"<ifname>"}=0 to silence an interface.'
        - macro: '{$HARES.IPC.EXPECTED}'
          value: '1'
          description: '1 = alert when no camera information is reported; 0 = disable'
        - macro: '{$HARES.IPC.STATUS.OK}'
          value: ONLINE
          description: 'IPC.Status text meaning the camera is online (case-insensitive). Any other value counts as offline.'
        - macro: '{$HARES.MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Memory utilization threshold, %'
        - macro: '{$HARES.NET.IF.NAME.NOT_MATCHES}'
          value: '^(lo|Loopback.*|sit0|ip6tnl0)$'
          description: 'Interfaces to exclude from discovery'
        - macro: '{$HARES.NODATA}'
          value: 30m
        - macro: '{$HARES.RTSP.PORT}'
          value: '554'
        - macro: '{$HARES.UPTIME.MIN}'
          value: 10m
        - macro: '{$HARES.UPTIME.MULTIPLIER}'
          value: '0.01'
          description: 'Converts the vendor uptime value to seconds. Verified: the OID counts in units of 10 ms (100 per second) although labelled (ms).'
        - macro: '{$HARES.WEB.PORT}'
          value: '80'
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
      valuemaps:
        - uuid: '4d622ea05b434e50a749e31aa68690a7'
          name: 'IF-MIB::ifOperStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDown
        - uuid: '615ed1a50525473d8f9aa59c3a3f0831'
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: 'b7f376fc70404b7fa68e40172b433e4e'
          name: zabbix.host.available
          mappings:
            - value: '0'
              newvalue: 'Not available'
            - value: '1'
              newvalue: Available
            - value: '2'
              newvalue: Unknown
  triggers:
    - uuid: 'a3633d02962845dd983beddfb5ec7ade'
      expression: 'max(/HARES NVR-A64RH-16D by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
      name: 'SNMP is not available'
      priority: AVERAGE
      description: 'SNMP agent of the NVR has not responded for {$SNMP.TIMEOUT}. Check SNMP is enabled on the NVR, community/credentials, UDP 161 reachability.'
      tags:
        - tag: scope
          value: availability
    - uuid: '5803042119d3402e8a29a1c491e24c74'
      expression: 'max(/HARES NVR-A64RH-16D by SNMP/icmpping,#3)=0'
      name: 'Unavailable by ICMP ping'
      priority: HIGH
      description: 'NVR is not reachable by ICMP for 3 consecutive checks.'
      tags:
        - tag: scope
          value: availability
    - uuid: 'e4e3b20fb5114b689ea0c1795def3622'
      expression: 'min(/HARES NVR-A64RH-16D by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/HARES NVR-A64RH-16D by SNMP/icmppingloss,5m)<100'
      name: 'High ICMP ping loss'
      priority: WARNING
      dependencies:
        - name: 'Unavailable by ICMP ping'
          expression: 'max(/HARES NVR-A64RH-16D by SNMP/icmpping,#3)=0'
      tags:
        - tag: scope
          value: availability
    - uuid: '20987b8cc9d8416eaefae750599c6865'
      expression: 'avg(/HARES NVR-A64RH-16D by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
      name: 'High ICMP ping response time'
